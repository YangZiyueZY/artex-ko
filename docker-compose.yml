services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 文件中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 本分支在每次发布标签（v*）时向 GitHub Container Registry 发布的镜像
    # （见 .github/workflows/release.yml 的 docker 作业）。上游 autumn27/artex 已从 Docker Hub 下架。
    image: ghcr.io/jiwoochris/artex-global:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # 首次运行保护。留空时启动日志会打印随机设置 token，需在 /setup 页面输入该值
      # 才能创建管理员密码（用 docker compose logs artex 查看）。
      # 指定 ARTEX_ADMIN_PASSWORD 时，无需 /setup，直接用该值初始化（至少 8 个字符）。
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # 浏览器跨源允许列表（逗号分隔）。内置 UI 同源，通常留空。
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
      # 服务端默认输出语言（zh·en·ko·es·ja）。默认 zh。智能体输出和错误消息以设置页面的
      # “显示语言”为优先，服务端控制台日志只遵循此值。
      ARTEX_LANG: ${ARTEX_LANG:-zh}
    ports:
      # 默认只发布到主机的 127.0.0.1。如需从其他设备直接访问，请在 .env 中
      # 设置 ARTEX_BIND=0.0.0.0，但必须先完成初始设置（管理员密码），
      # 并尽可能使用 README 中的反向代理（HTTPS）配置。
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 将数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/。
      # 可直接在主机上查看、备份，重新创建容器也不会丢失。
      - ./data:/app/data
      # 把项目根目录的 skills 挂载到容器（覆盖镜像内置的 /app/skills）。
      # 修改 skill 后无需重新构建镜像，容器会直接读取主机上的这些文件。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
