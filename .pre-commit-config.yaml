# pre-commit 配置示例（官方文档：https://pre-commit.com）
#
# 在本地提交阶段先通过仓库 CI 的两道确定性合并门禁，让有问题的
# 改动在推送前就被拦下。任一 hook 断言失败都会以非 0 退出码结束，使提交
# 停止。
#
# 1) detections —— 仅在提交改动了探测规则（detections/）、这些规则固定的上游源码，或防御指南中的
#    内联 Sigma 模板（docs/defense-{ko,en}.md）时，运行一次性执行八项探测测试和三个
#    门禁的运行器（detections/tests/run-all.sh）。先通过与 CI
#    （.github/workflows/detections.yml）相同的规则·源码范围，以拦截只改规则而未更新
#    测试和覆盖层，或改了防御模板却未更新其指南断言的改动。依赖 Docker
#    （每项测试都在容器中隔离运行，运行器不安装任何东西）。
# 2) docs —— 校验受跟踪的 Markdown 文档中的仓库内部链接、图片和锚点（#标题）引用是否指向
#    真实存在的目标（scripts/check-doc-links.py）。与 CI（.github/workflows/docs.yml）中的
#    检查相同；为与那边不加 paths 过滤、对所有改动都运行的做法保持一致，这里也不缩小
#    目标文件范围（always_run）。因为链接不仅在修改 .md 时会坏，在删除或移动链接所指向的
#    文件（图片、LICENSE 等）时也会坏。只使用 Python 标准库、不访问网络，
#    因此无需 Docker，几十毫秒内即可完成。
#
# 安装：       pip install pre-commit && pre-commit install
# 手动运行：   pre-commit run detections --all-files
#              pre-commit run docs --all-files
#
# 这是只挂两个 hook 的最小示例。若还想挂 Go 和 Web 的 lint，请在下面各自添加 hook。
repos:
  - repo: local
    hooks:
      - id: detections
        name: 探测规则测试 8 项（Sigma·Suricata·ATT&CK·指标·MISP）
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go|docs/defense-(ko|en)\.md)'
      - id: docs
        name: 文档内部链接·图片·锚点（#标题）完整性检查
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
