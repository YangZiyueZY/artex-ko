name: 🐛 缺陷报告
description: 报告与预期不符的行为或出现的错误。
title: "[缺陷] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。填写以下项目有助于更快复现和修复。
        **安全漏洞请勿使用本模板，而应通过 [SECURITY.md](https://github.com/jiwoochris/artex-global/security/policy) 的私密流程报告。**
  - type: checkboxes
    id: preflight
    attributes:
      label: 确认
      options:
        - label: 我已搜索过是否已有类似 Issue。
          required: true
        - label: 该问题是在自有、获授权的目标或本地隔离环境中复现的。
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 请同时写明预期行为和实际行为。
      placeholder: "例：探测结果本应为中文，却输出成了韩文/英文。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按顺序写出能重现该问题的步骤。
      placeholder: |
        1. 进入 '...' 页面
        2. 执行 '...'
        3. 在 '...' 处发生错误
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志·截图
      description: 请粘贴相关日志或截图。敏感值（API 密钥、token、目标地址）请打码。
      render: shell
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: 领域
      description: 请选择发生问题的组件。
      options:
        - 智能体（agent）
        - Web UI / 服务器（web / server）
        - 安装·部署（Docker·脚本）
        - LLM 提供商集成
        - 文档·翻译
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 请填写发行标签或提交哈希。
      placeholder: "例：v2.2.0 或 b45ba04"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请填写操作系统、是否使用 Docker、LLM 模型等。
      placeholder: "例：macOS 15 / Docker Compose / claude-opus-4-8"
    validations:
      required: false
