name: 🌐 翻译·本地化问题
description: 报告翻译（中文、英文、韩文、西班牙文、日文）生硬、错误或缺失的问题。
title: "[翻译] "
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助提升全球版的翻译质量。
        本仓库的本地化方针是：**只把用户可见的产物转换为所选语言，智能体的内部推理提示词以及命令、payload、代码、日志原文一律保持原样。**
          详细原则见 [CONTRIBUTING.md](../../CONTRIBUTING.md#本地化方针)（本地化方针：中文为源语言，其他语言填各自文件）。
  - type: dropdown
    id: kind
    attributes:
      label: 属于哪类问题
      options:
        - 翻译生硬或不自然
        - 翻译错误（含义不同）
        - 翻译缺失（仍显示为韩文·英文）
        - 不该翻译的内容被翻译（命令、代码、日志等）
        - 术语需要统一
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 在哪里看到
      options:
        - Web UI
        - 智能体产物（探测结果·摘要·报告·对话回复）
        - 文档（README 等）
        - 其他
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前文案
      description: 请原样粘贴当前显示的文案，并说明是哪个页面、什么场景。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议文案
      description: 请提出希望如何修改。（可选）
    validations:
      required: false
  - type: input
    id: key
    attributes:
      label: 消息键 / 文件位置
      description: 仅在知道时填写。例如 web/messages/zh.json 中的键或文件路径。
      placeholder: "例：web/messages/zh.json → dashboard.title"
    validations:
      required: false
