name: 💡 功能建议
description: 提出新功能或改进想法。
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出想法。填写以下项目有助于对齐方向。
  - type: checkboxes
    id: preflight
    attributes:
      label: 确认
      options:
        - label: 我已搜索过是否已有类似建议。
          required: true
        - label: 该建议不会助长超出授权使用范围和适用法律的用法。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 源于什么问题或需求
      description: 请先描述想解决的情形。了解问题比给出方案更重要。
      placeholder: "例：把探测结果分享给团队时，希望把报告导出为 PDF。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明希望如何解决。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如果考虑过其他方法，请写下来。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关领域
      options:
        - 智能体（agent）
        - Web UI / 服务器（web / server）
        - LLM 提供商集成
        - 文档·翻译
        - 其他
    validations:
      required: false
