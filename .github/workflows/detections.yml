name: detections
# 每当改动探测规则（Sigma·Suricata·ATT&CK 覆盖层）的推送·PR 到来时，用可复现测试验证：
# 该规则确实会触发、能转换为多种 SIEM 后端、覆盖层与规则一致、指标仍与上游
# 源码相符，并通过 SigmaHQ 惯例的完整校验。只改规则而不更新测试和覆盖层的改动
# 会在这里变红。本工作流以合并门禁的形式真正落实 CONTRIBUTING.md 与
# detections/tests/README.md 承诺的“八项测试以机器方式强制贡献契约”。Go 构建、静态分析与测试由 ci.yml 负责。
# 除八项测试外，同一合并门禁还会运行三个非规则门禁：测试框架注册表
# 同步检查、主机分类工具（detections/triage/artex_host_triage.py）的自测，以及
# 防御指南（docs/defense-{ko,en}.md）中以正文形式写出的内联 Sigma 关联模板的
# 一致性检查。三者都与八项规则测试相互独立，run-all.sh 同样会运行。第三个门禁
# 复现该模板在防御指南中声明的事实（通过 `sigma check`、splunk/eql/loki 转换、
# 不支持 lucene/kusto 关联、ko/en 规则正文相同），从而在合并门禁中捕获
# 上游 sigma-cli·后端升级导致正文悄悄过时的情况。
#
# 八项测试只需 Docker 即可运行（ubuntu-latest 运行器自带 Docker）。运行器会拉取
# sigma-cli·scapy·suricata·python 镜像并在容器中隔离运行，因此运行器
# 本身不安装任何东西；规则树和指标所指向的源码文件仅以只读方式
# 挂载，不写入仓库。除 detections/ 下发生变化外，指标测试所固定的
# 源文件变化时也会运行。enrich·selfupdate·guard·db 的 User-Agent、标记、破坏性命令
# token，cmd/artex/main.go 的默认监听·代理端口，traffic/traffic.go 的 MITM CA 证书
# 文件名，db/schema.sql 的探索图谱 schema 指纹都属于此列。源码变更导致指标
# 变化、使规则·指标列表悄悄过时的情况，会在合并门禁中被捕获。由于无需认证即可拉取
# 公开 Docker 镜像，偶尔可能触发 Docker Hub 拉取限速，此时重新运行作业即可缓解。
on:
  push:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      # 第三个门禁（防御模板一致性检查）读取的两个文件。该模板变化时需要
      # 重新验证，因此加入触发器。
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - "docs/defense-ko.md"
      - "docs/defense-en.md"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# 同一分支有新推送时取消先前的运行，避免频繁推送期间堆积
# 不必要的运行。
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 测试框架注册表同步检查（run-all.sh ↔ CI ↔ 目录）
        run: detections/tests/check-harness-sync.sh
      - name: 主机分类工具自测（artex_host_triage.py --self-test · 非规则门禁）
        run: detections/tests/triage-selftest.sh
      - name: 防御指南内联 Sigma 模板一致性检查（sigma check·转换矩阵·ko/en 正文相同 · 非规则门禁）
        run: detections/tests/check-defense-template.sh
      - name: Sigma 规则复现测试（sigma check + 后端转换 + 指标保留）
        run: detections/tests/sigma/run.sh
      - name: Sigma 实际事件匹配测试（原子·关联规则对恶意样本/时间线触发、对正常流量保持沉默）
        run: detections/tests/sigma_match/run.sh
      - name: Sigma SigmaHQ 惯例 lint（完整校验器集合 + 已文档化的基准）
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma 后端可移植性测试（确认关联规则能转换为多种后端）
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata 规则复现测试（合成 pcap → suricata -r → 断言告警数量）
        run: detections/tests/suricata/run.sh
      - name: ATT&CK 覆盖层 ↔ 规则一致性测试
        run: detections/tests/attack/run.sh
      - name: 探测指标 ↔ 上游源码一致性测试（上游重新同步漂移防护）
        run: detections/tests/indicators/run.sh
      - name: 指标 MISP 导出 ↔ CSV 同步测试（用 pymisp 校验 MISP 格式有效性）
        run: detections/tests/misp/run.sh
