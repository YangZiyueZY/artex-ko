name: ci
# 每次推送和 PR 都运行构建·静态分析·测试，在合并前捕获中文化过程中产生的回归。
# 发布工作流（release.yml）只在标签（v*）上运行，且只做构建·部署，
# 因此日常改动的验证由本工作流负责。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # 在没有数据库的情况下运行构建·静态分析·测试。完整复现贡献者 clone 仓库后
  # 不装 PostgreSQL 就运行 `go test ./...` 的环境。需要数据库的集成测试在此环境中
  # 会用 t.Skipf 跳过（跳过计为通过），因此构建、go vet 以及不依赖 DB 的
  # 单元测试必须全部为 green。仅这一组合也能在合并前捕获跨包边界的回归
  # （例如修改一个包的文案却破坏了另一个包的测试断言）。
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test（无 DB —— 集成测试跳过）
        run: go test ./... -count=1

  # 负责必须有真实 PostgreSQL 才能运行的 DB 集成测试（通知·证据·用量计量等）。
  # 用真实数据库强制执行上面 go 作业跳过的路径（通知渠道校验、证据存储、llm_usage 计量等），
  # 连只在 DB 集成路径中暴露的中文化回归也能在合并前捕获。
  #
  # 上游的测试框架设计为所有包共享一个数据库、表只创建一次并复用，
  # 且隐式依赖包的执行顺序和累积数据；因此把全部内容塞进一个数据库运行，
  # 会以不同方式出错（累积数据污染、连接 teardown 竞争、重置时的跨包 schema 依赖）。
  # 所以这里为每个包启动各自的 PostgreSQL 服务，以“空数据库 + 单包”隔离运行。
  # 每个包作为独立作业（matrix）运行，互不触碰对方的数据、连接和 schema，那三种
  # 冲突就从结构上消失了。db.Open 会自动迁移 schema；像 llm_usage 这样
  # db.Open 不创建的表，各测试用 EnsureLLMUsageTable 自行保证。
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test（DB 集成 · ${{ matrix.pkg }} 包隔离）
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1
