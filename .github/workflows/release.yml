name: release
# 打发布标签（v*）即构建**全部平台**的运行版本：Linux / Windows / macOS ×
# amd64、arm64、386（32 位 x86）、armv7、armv6（32 位 ARM），同时生成 zip 包与
# SHA256SUMS，并（可选用）构建 amd64+arm64 多架构镜像推到 ghcr.io。
#
# 手动触发（Actions → release → Run workflow）只构建并上传产物，不创建 GitHub Release；
# 需要正式发布时再打 v* 标签。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "构建版本号（写入二进制与包名）。留空：打标签时用标签名，手动运行时用 dev.<运行号>"
        required: false
        default: ""
      publish_docker:
        description: "同时构建并推送 amd64/arm64 多架构镜像到 ghcr.io"
        type: boolean
        default: true

permissions:
  contents: write # 创建 Release 需要

# 同一分支/标签只保留一个发布任务，避免并发写 Release 与镜像标签。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ① 前端静态导出（只做一次），产物给各平台交叉编译复用（-tags embedui 内嵌进二进制）。
  frontend:
    name: 前端静态导出
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out
          retention-days: 3

  # ② 多平台交叉编译（纯 Go，无需 QEMU）+ zip 打包。
  #    32 位目标（386 / armv6 / armv7）由 Go 交叉编译直接产出，不需要额外的构建机。
  binaries:
    name: 编译 ${{ matrix.slug }}
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux/amd64,   slug: linux-amd64,   bin: amd64 }
          - { target: linux/arm64,   slug: linux-arm64,   bin: arm64 }
          - { target: linux/386,     slug: linux-386 }
          - { target: linux/arm/v7,  slug: linux-armv7 }
          - { target: linux/arm/v6,  slug: linux-armv6 }
          - { target: windows/amd64,  slug: windows-amd64 }
          - { target: windows/arm64,  slug: windows-arm64 }
          - { target: windows/386,    slug: windows-386 }
          - { target: darwin/amd64,   slug: darwin-amd64 }
          - { target: darwin/arm64,   slug: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: 解析版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "构建版本：${version}，目标：${{ matrix.target }}"
      - name: 编译并打包
        env:
          ARTEX_BUILD_VERSION: ${{ steps.ver.outputs.version }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          ARTEX_COMPRESS: "0"   # UPX 自解压 ELF 在部分内核/虚拟化/安全策略下会崩溃，Release 保持可移植
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: ./build.sh --target "${{ matrix.target }}"
      - name: 校验发布包内容
        run: |
          set -euo pipefail
          for z in dist/*.zip; do
            echo "== $z"
            names="$(unzip -Z1 "$z")"
            grep -qE '^[^/]+/(artex|artex\.exe)$' <<<"$names" || { echo "::error::$z 缺少二进制"; exit 1; }
            grep -qE '^[^/]+/(start\.sh|start\.bat)$' <<<"$names" || { echo "::error::$z 缺少启动脚本"; exit 1; }
            grep -qE '^[^/]+/config\.example\.json$' <<<"$names" || { echo "::error::$z 缺少配置样例"; exit 1; }
            grep -qE '^[^/]+/skills/' <<<"$names" || { echo "::error::$z 缺少 skills/"; exit 1; }
          done
      - name: 冒烟测试（linux/amd64，直接执行）
        if: matrix.target == 'linux/amd64'
        run: ./dist/artex-linux-amd64/artex -h | head -n 5
      - name: 冒烟测试（linux/386，32 位内核支持时执行）
        if: matrix.target == 'linux/386'
        continue-on-error: true # 少数 runner 内核未开 IA32 模拟，此时仅记录告警不阻断发布
        run: ./dist/artex-linux-386/artex -h | head -n 5
      - name: 架构检查（无法在本机执行的 ARM 目标）
        if: matrix.target != 'linux/amd64' && matrix.target != 'linux/386'
        run: file dist/artex-${{ matrix.slug }}/artex dist/artex-${{ matrix.slug }}/artex.exe || file dist/artex-${{ matrix.slug }}/artex
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.slug }}
          path: dist/*.zip
          if-no-files-found: error
      # Linux 原始二进制单独上传，供 docker 作业复用（避免在镜像里重新编译）。
      - if: matrix.bin
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.bin }}
          path: dist/artex-linux-${{ matrix.bin }}/artex

  # ③ 汇总所有 zip → SHA256SUMS（手动运行也会产出可下载产物）。
  checksums:
    name: 汇总校验和
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -lh
          sha256sum -- *.zip | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  # ④ 创建 GitHub Release（仅标签推送；手动运行只留 Actions 产物）。
  release:
    name: 创建 GitHub Release
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ⑤ 多架构镜像（linux/amd64 + linux/arm64）→ GitHub Container Registry。
  #    镜像名默认 ghcr.io/<owner>/<repo>（全小写），可用仓库变量 ARTEX_IMAGE 覆盖。
  #    首次发布后请在 Packages 设置里把该镜像设为 Public，否则匿名拉取需要先 docker login。
  docker:
    name: 多架构镜像（ghcr.io）
    needs: binaries
    if: needs.binaries.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.publish_docker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4 # Dockerfile + skills/
      - name: 解析镜像名（必须全小写）
        id: image
        run: |
          set -euo pipefail
          name="${{ vars.ARTEX_IMAGE || format('ghcr.io/{0}', github.repository) }}"
          echo "name=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=manual-${{ github.run_number }},enable=${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
