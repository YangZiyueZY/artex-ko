name: docs
# 每次推送·PR 时检查受跟踪的 Markdown 文档中的仓库内部链接、图片引用是否指向真实存在的
# 文件，以及文档锚点链接（#标题）是否指向目标文档中确实存在的标题，从而阻止
# 损坏的链接、图片、锚点被合并。链接指向的文件可能位于仓库任何位置
# （例如 ../LICENSE·screenshots/en/*.png），因此不加 paths 过滤，对所有改动都运行。
# 外部 URL（http/https/mailto）依赖网络、容易 flaky，因此不检查 —— scripts/check-doc-links.py 只看内部引用。
# 只使用 Python 标准库、不访问网络，结果确定，因此不会因 Docker Hub 限速之类的外部因素
# 而闪烁。Go 构建、静态分析与测试由 ci.yml 负责，探测规则复现由 detections.yml 负责，
# 中文 UI 构建由 web.yml 负责。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# 同一分支有新推送时取消先前的运行，避免堆积不必要的运行。
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # python3 已预装在 ubuntu-latest 运行器上，脚本只使用标准库，
      # 因此无需单独的安装步骤。用 -I 隔离用户 site 和环境后执行。
      - name: 文档内部链接·图片·锚点完整性检查
        run: python3 -I scripts/check-doc-links.py
