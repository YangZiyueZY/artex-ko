name: web
# 在每次推送·PR 时运行中文 UI（web/）的静态导出构建，在合并前捕获前端回归。
# 发布工作流（release.yml）只在标签（v*）上构建 web，而本分支没有标签推送
# 历史，因此从未执行过 —— 所以日常 web 改动（TypeScript·React·i18n·next-intl）的验证
# 由本工作流负责。Go 侧构建·测试由 ci.yml 负责，因此这里只在 web/ 变化时运行（paths 过滤）。
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  # 静态导出构建是合并门禁。`NEXT_EXPORT=1 next build` 因 next.config 未设置
  # typescript.ignoreBuildErrors，会一并执行 TypeScript 类型检查，因此
  # 一旦有类型错误或导出失败，该作业就会变红停止，阻止合并。
  #
  # biome lint 也是合并门禁。把上游带来的既有 lint 债务（G7）清零
  # 后（错误 8→0：skills 树 a11y 6 + package.json 格式化器 1 + logo.svg noSvgWithoutTitle 1），
  # 把信息性步骤提升为门禁。现在 `npm run check`（biome check）一旦报错，该
  # 作业就会变红停止，阻止合并，防止刚清理干净的状态再次被弄脏。
  # 警告和信息不影响退出码（biome 仅在 error 级别返回非 0），因此不阻塞合并。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: 单元测试（合并门禁 · vitest）
        # 在合并前捕获纯逻辑（getInitials/formatCurrency、i18n config、statusMeta）和 i18n 键一致性的回归。
        run: npm run test -- --run
      - name: i18n 语言键一致性（合并门禁 · 5 个语言与基准语言一致）
        # 以 zh.json 为基准（中文为源语言），检查 en/ko/es/ja 的键集合是否完全一致（缺失或新增都会失败）。
        run: npm run check:i18n
      - name: build:static（合并门禁 · 含类型检查）
        run: npm run build:static
      - name: UI 韩文泄漏防护（合并门禁 · out HTML 中韩文为 0）
        # 本分支的核心成果是“用户可见的界面中没有韩文残留��（语言自称名除外）。
        # 在合并前阻止贡献者硬编码韩文或漏译导致的回归。
        # 脚本会自行定位 git 根目录下的 web/out，因此与工作目录无关。
        run: python3 -I ../scripts/check-web-cjk.py
      - name: biome check（合并门禁 · lint·format·a11y 错误保持 0）
        if: always()
        run: npm run check
