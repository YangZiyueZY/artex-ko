name: external-links
# 检查受跟踪的 Markdown 所指向的外部链接（防御指南中的事件报告入口 boho.or.kr·privacy.go.kr·
# pipc.go.kr·fsec.or.kr，CISA KEV，OWASP·SigmaHQ·Suricata·MITRE·MISP，原始演示，GitHub
# 徽章等）是否仍然有效。外部 URL 的存活依赖网络和远程服务器策略，容易
# flaky，因此内部链接合并门禁（docs.yml）不检查它。于是本工作流
# 不在推送·PR 时运行，而只通过每周计划和手动执行（workflow_dispatch）运行，**不阻塞合并**；
# 外部链接一旦变质或关闭，周期运行就会变红暴露出来。内部链接·锚点由 docs.yml 负责，Go 构建·
# 分析·测试由 ci.yml 负责，探测规则由 detections.yml 负责，中文 UI 构建由 web.yml 负责。
#
# --strict 仅在出现 allowlist（scripts/external-links-allowlist.txt）之外的 DOWN（404·410·5xx·
# DNS/连接错误）时失败。RESTRICTED（机器人拦截、限速等主机仍
# 存活的状态）和 ALLOWED（我们无法修复的上游继承死链）不计为失败，
# 因此红灯的信号是“我们文档中策展的外部链接新坏了 —— 去看看”。计划
# 工作流只在默认分支（main）上运行。
on:
  schedule:
    - cron: "17 0 * * 1" # 每周一 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # python3 已预装在 ubuntu-latest 运行器上，脚本只使用标准库，
      # 因此无需单独安装。用 -I 隔离用户 site 和环境后执行。
      - name: 外部链接存活检查（浏览器 UA·GET·跟踪重定向 · 排除 allowlist · 不阻塞合并）
        run: python3 -I scripts/check-external-links.py --strict
